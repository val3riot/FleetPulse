services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?POSTGRES_VERSION must be set}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT must be set}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:${FLYWAY_VERSION:?FLYWAY_VERSION must be set}
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./infrastructure/flyway/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:${REDIS_VERSION:?REDIS_VERSION must be set}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT must be set}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:${KAFKA_VERSION:?KAFKA_VERSION must be set}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:?KAFKA_PORT must be set}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:?KAFKA_VERSION must be set}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_TOPIC_RAW:?KAFKA_TOPIC_RAW must be set} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_TOPIC_REJECTED:?KAFKA_TOPIC_REJECTED must be set} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ${KAFKA_TOPIC_DEAD_LETTER:?KAFKA_TOPIC_DEAD_LETTER must be set} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  fleet-api:
    build:
      context: .
      dockerfile: services/fleet-api/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:?MAVEN_IMAGE must be set}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?JAVA_RUNTIME_IMAGE must be set}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${FLEET_API_PORT:?FLEET_API_PORT must be set}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  telemetry-gateway:
    build:
      context: .
      dockerfile: services/telemetry-gateway/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:?MAVEN_IMAGE must be set}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?JAVA_RUNTIME_IMAGE must be set}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      GATEWAY_TCP_PORT: "7000"
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      GATEWAY_TCP_ENABLED: "true"
      KAFKA_CONFIRMATION_TIMEOUT: ${KAFKA_CONFIRMATION_TIMEOUT:?KAFKA_CONFIRMATION_TIMEOUT must be set}
    ports:
      - "127.0.0.1:${GATEWAY_TCP_PORT:?GATEWAY_TCP_PORT must be set}:7000"
      - "127.0.0.1:${GATEWAY_HTTP_PORT:?GATEWAY_HTTP_PORT must be set}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  telemetry-processor:
    build:
      context: .
      dockerfile: services/telemetry-processor/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:?MAVEN_IMAGE must be set}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?JAVA_RUNTIME_IMAGE must be set}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW}
      KAFKA_TOPIC_REJECTED: ${KAFKA_TOPIC_REJECTED}
      KAFKA_TOPIC_DEAD_LETTER: ${KAFKA_TOPIC_DEAD_LETTER}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:?KAFKA_CONSUMER_GROUP_ID must be set}
      KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS: ${KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:-3}
      KAFKA_CONSUMER_RETRY_INITIAL_BACKOFF: ${KAFKA_CONSUMER_RETRY_INITIAL_BACKOFF:-500ms}
      KAFKA_CONSUMER_RETRY_MAX_BACKOFF: ${KAFKA_CONSUMER_RETRY_MAX_BACKOFF:-5s}
      KAFKA_CONSUMER_RETRY_MULTIPLIER: ${KAFKA_CONSUMER_RETRY_MULTIPLIER:-2.0}
      KAFKA_CONSUMER_RETRY_JITTER_RATIO: ${KAFKA_CONSUMER_RETRY_JITTER_RATIO:-0.2}
    ports:
      - "127.0.0.1:${PROCESSOR_HTTP_PORT:?PROCESSOR_HTTP_PORT must be set}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  vehicle-simulator:
    build:
      context: .
      dockerfile: simulators/vehicle-simulator/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:?MAVEN_IMAGE must be set}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?JAVA_RUNTIME_IMAGE must be set}
    environment:
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
      SIMULATOR_VEHICLE_COUNT: ${SIMULATOR_VEHICLE_COUNT:-5}
      SIMULATOR_FLEET_API_BASE_URL: http://fleet-api:8080
      SIMULATOR_GATEWAY_HOST: telemetry-gateway
      SIMULATOR_GATEWAY_PORT: "7000"
      SIMULATOR_GATEWAY_CONNECT_TIMEOUT: ${SIMULATOR_GATEWAY_CONNECT_TIMEOUT:-3s}
      SIMULATOR_SEND_INTERVAL: ${SIMULATOR_SEND_INTERVAL:-1s}
      SIMULATOR_SHUTDOWN_GRACE_PERIOD: ${SIMULATOR_SHUTDOWN_GRACE_PERIOD:-5s}
      SIMULATOR_RECONNECT_INITIAL_BACKOFF: ${SIMULATOR_RECONNECT_INITIAL_BACKOFF:-250ms}
      SIMULATOR_RECONNECT_MAX_BACKOFF: ${SIMULATOR_RECONNECT_MAX_BACKOFF:-5s}
      SIMULATOR_RECONNECT_MAX_ATTEMPTS: ${SIMULATOR_RECONNECT_MAX_ATTEMPTS:-10}
      SIMULATOR_RECONNECT_JITTER_RATIO: ${SIMULATOR_RECONNECT_JITTER_RATIO:-0.2}
      SIMULATOR_VEHICLE_SERVICE_INTERVAL_KM: ${SIMULATOR_VEHICLE_SERVICE_INTERVAL_KM:-15000}
      SIMULATOR_VEHICLE_INITIAL_ODOMETER_KM: ${SIMULATOR_VEHICLE_INITIAL_ODOMETER_KM:-10000}
    depends_on:
      fleet-api:
        condition: service_healthy
      telemetry-gateway:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:?PROMETHEUS_VERSION must be set}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:?PROMETHEUS_PORT must be set}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:?GRAFANA_VERSION must be set}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?GRAFANA_PORT must be set}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  grafana-data:
