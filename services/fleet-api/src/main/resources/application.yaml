spring:
  application:
    name: fleet-api
  datasource:
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:1000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:500}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetpulse}
    username: ${SPRING_DATASOURCE_USERNAME:fleetpulse}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
      minimum-expected-value:
        "http.server.requests": "${METRICS_TIMER_MIN:1ms}"
      maximum-expected-value:
        "http.server.requests": "${METRICS_TIMER_MAX:30s}"
      slo:
        "http.server.requests": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  packages-to-scan: it.fleetpulse.api
  paths-to-match: /api/v1/**

  api-docs:
    path: /v3/api-docs
    version: openapi_3_1

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  writer-with-order-by-keys: true

fleetpulse:
  api:
    dashboard:
      reporting-window: ${API_DASHBOARD_REPORTING_WINDOW:1m}
      relevant-alerts-limit: ${API_DASHBOARD_RELEVANT_ALERTS_LIMIT:10}
    state:
      stale-after: ${API_STATE_STALE_AFTER:1m}
      cache:
        ttl: ${TELEMETRY_LATEST_STATE_TTL:5m}
        max-attempts: ${API_STATE_CACHE_MAX_ATTEMPTS:1}

logging:
  structured:
    format:
      console: ${FLEETPULSE_LOG_FORMAT:ecs}
