spring:
  application:
    name: telemetry-processor
  datasource:
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:1000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:500}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetpulse}
    username: ${SPRING_DATASOURCE_USERNAME:fleetpulse}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${fleetpulse.kafka.consumer.group-id}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: it.fleetpulse.contracts.telemetry.TelemetryEvent
        spring.json.trusted.packages: it.fleetpulse.contracts.telemetry
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    listener:
      type: single
      ack-mode: record
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

fleetpulse:
  health:
    kafka-timeout: ${KAFKA_HEALTH_TIMEOUT:1s}
  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:fleetpulse-telemetry-processor-v1}
      retry-max-attempts: ${KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      retry-initial-backoff: ${KAFKA_CONSUMER_RETRY_INITIAL_BACKOFF:500ms}
      retry-max-backoff: ${KAFKA_CONSUMER_RETRY_MAX_BACKOFF:5s}
      retry-multiplier: ${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
      retry-jitter-ratio: ${KAFKA_CONSUMER_RETRY_JITTER_RATIO:0.2}
    terminal-publication:
      confirmation-timeout: ${KAFKA_TERMINAL_CONFIRMATION_TIMEOUT:5s}
    topics:
      raw: ${KAFKA_TOPIC_RAW:telemetry.raw.v1}
      rejected: ${KAFKA_TOPIC_REJECTED:telemetry.rejected.v1}
      dead-letter: ${KAFKA_TOPIC_DEAD_LETTER:telemetry.dead-letter.v1}
  telemetry:
    alerts:
      maximum-engine-temperature-c: ${TELEMETRY_ALERT_MAXIMUM_ENGINE_TEMPERATURE_C:110.0}
      minimum-battery-voltage: ${TELEMETRY_ALERT_MINIMUM_BATTERY_VOLTAGE:11.8}
    latest-state:
      ttl: ${TELEMETRY_LATEST_STATE_TTL:5m}
      max-attempts: ${TELEMETRY_LATEST_STATE_MAX_ATTEMPTS:1}
server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka,consumer
  health:
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "fleetpulse.pipeline.persistence.latency": true
        "fleetpulse.processing.latency": true
        "fleetpulse.processor.projection.latency": true
      minimum-expected-value:
        "fleetpulse.pipeline.persistence.latency": "${METRICS_TIMER_MIN:1ms}"
        "fleetpulse.processing.latency": "${METRICS_TIMER_MIN:1ms}"
        "fleetpulse.processor.projection.latency": "${METRICS_TIMER_MIN:1ms}"
      maximum-expected-value:
        "fleetpulse.pipeline.persistence.latency": "${METRICS_TIMER_MAX:30s}"
        "fleetpulse.processing.latency": "${METRICS_TIMER_MAX:30s}"
        "fleetpulse.processor.projection.latency": "${METRICS_TIMER_MAX:30s}"
      slo:
        "fleetpulse.pipeline.persistence.latency": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
        "fleetpulse.processing.latency": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
        "fleetpulse.processor.projection.latency": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: ${FLEETPULSE_LOG_FORMAT:ecs}
