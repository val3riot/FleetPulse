spring:
  application:
    name: telemetry-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

gateway:
  tcp:
    enabled: ${GATEWAY_TCP_ENABLED:false}
    port: ${GATEWAY_TCP_PORT:7000}
    max-connections: ${GATEWAY_TCP_MAX_CONNECTIONS:100}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
