spring:
  application:
    name: telemetry-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max.block.ms: ${GATEWAY_KAFKA_MAX_BLOCK_MS:1000}
        request.timeout.ms: ${GATEWAY_KAFKA_REQUEST_TIMEOUT_MS:1000}
        delivery.timeout.ms: ${GATEWAY_KAFKA_DELIVERY_TIMEOUT_MS:4000}
        linger.ms: ${GATEWAY_KAFKA_LINGER_MS:0}
        enable.idempotence: true
        spring.json.add.type.headers: false


server:
  port: 8080

gateway:
  tcp:
    enabled: ${GATEWAY_TCP_ENABLED:false}
    port: ${GATEWAY_TCP_PORT:7000}
    max-connections: ${GATEWAY_TCP_MAX_CONNECTIONS:100}
    read-timeout: ${GATEWAY_TCP_READ_TIMEOUT:30s}
    shutdown-grace-period: ${GATEWAY_TCP_GRACE_PERIOD:5s}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,tcp,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "fleetpulse.gateway.publish.latency": true
        "fleetpulse.gateway.ack.latency": true
      minimum-expected-value:
        "fleetpulse.gateway.publish.latency": "${METRICS_TIMER_MIN:1ms}"
        "fleetpulse.gateway.ack.latency": "${METRICS_TIMER_MIN:1ms}"
      maximum-expected-value:
        "fleetpulse.gateway.publish.latency": "${METRICS_TIMER_MAX:30s}"
        "fleetpulse.gateway.ack.latency": "${METRICS_TIMER_MAX:30s}"
      slo:
        "fleetpulse.gateway.publish.latency": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
        "fleetpulse.gateway.ack.latency": "${METRICS_TIMER_BUCKETS:50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s}"
  endpoints:
    web:
      exposure:
        include: health,prometheus
fleetpulse:
  health:
    kafka-timeout: ${KAFKA_HEALTH_TIMEOUT:1s}
  kafka:
    topics:
      raw: ${KAFKA_TOPIC_RAW:telemetry.raw.v1}
    publisher:
      confirmation-timeout: ${KAFKA_CONFIRMATION_TIMEOUT:5s}

logging:
  structured:
    format:
      console: ${FLEETPULSE_LOG_FORMAT:ecs}
