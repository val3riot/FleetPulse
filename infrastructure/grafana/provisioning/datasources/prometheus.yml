apiVersion: 1

# Recreate the legacy datasource (previously without a fixed UID) before provisioning.
# Dashboard references use the stable UID, never the database-assigned numeric ID.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: fleetpulse-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
